<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ボトルデザイン診断</title>
<style>
:root{--t:#536b86;--s:#7f8b98;--line:#e7ebef;--g:#2fa878;--p:#8c62a8;--gr:#8f98a4;--soft:#f6f8fa}
*{box-sizing:border-box}body{margin:0;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif}
button{font:inherit}.page{width:min(980px,100%);margin:auto;padding:30px 28px 70px}
header{padding:12px 0 30px;border-bottom:1px solid var(--line)}.logo{font-size:13px;letter-spacing:.14em;color:#9aa4ae;font-weight:700;margin-bottom:10px}
h1{margin:0;font-size:30px}.lead{margin:10px 0 0;color:var(--s);font-size:14px;line-height:1.8}
.start{text-align:center;padding:70px 0 40px}.start h2{font-size:22px;margin:0 0 12px}.start p{color:var(--s);line-height:1.8;margin:0 auto 28px}
.primary,.secondary{border:0;border-radius:10px;padding:14px 30px;cursor:pointer;font-weight:700}.primary{background:var(--t);color:#fff}.secondary{background:#eef1f4;color:var(--t)}
.hidden{display:none!important}.progress{padding-top:24px}.pt{display:flex;justify-content:space-between;color:#929ca7;font-size:13px;margin-bottom:9px}.bar{height:5px;background:#edf0f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t);transition:.2s}
.question{padding:38px 0 34px;border-bottom:1px solid var(--line)}.qt{text-align:center;margin:0 0 30px;font-size:22px;line-height:1.65}
.scale{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;gap:12px}.ep{font-size:14px;white-space:nowrap}.left{color:var(--g)}.right{color:var(--p);text-align:right}
.choices{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center}.choice{position:relative;width:100%;min-height:78px;display:flex;align-items:center;justify-content:center;cursor:pointer}.choice input{position:absolute;opacity:0}
.circle{width:36px;height:36px;border:3px solid var(--gr);border-radius:50%;transition:.16s;background:#fff}.choice:nth-child(1) .circle,.choice:nth-child(7) .circle{width:70px;height:70px}.choice:nth-child(2) .circle,.choice:nth-child(6) .circle{width:56px;height:56px}.choice:nth-child(3) .circle,.choice:nth-child(5) .circle{width:46px;height:46px}
.choice:nth-child(-n+3) .circle{border-color:var(--g)}.choice:nth-child(n+5) .circle{border-color:var(--p)}.choice:hover .circle{transform:scale(1.06)}
.choice:nth-child(-n+3) input:checked+.circle{background:var(--g);box-shadow:inset 0 0 0 8px #fff}.choice:nth-child(4) input:checked+.circle{background:var(--gr);box-shadow:inset 0 0 0 8px #fff}.choice:nth-child(n+5) input:checked+.circle{background:var(--p);box-shadow:inset 0 0 0 8px #fff}
.labels{display:grid;grid-template-columns:repeat(7,1fr);margin:3px 132px 0;color:#a1a9b2;font-size:10px;text-align:center}.nav{display:flex;justify-content:center;gap:12px;padding:28px 0}
.result{padding-top:40px}.hero{text-align:center;padding:24px 0 36px}.character-image{display:block;width:min(320px,80vw);aspect-ratio:1/1;object-fit:cover;margin:0 auto 22px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.parameters{max-width:800px;margin:0 auto 38px}
.parameters-title{text-align:center;font-size:18px;margin:0 0 18px}
.parameter{margin:0 0 22px}
.parameter-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}
.parameter-name{font-size:13px;font-weight:700}
.parameter-side{font-size:12px;color:#8a949f}
.parameter-track{position:relative;height:12px;border-radius:99px;background:linear-gradient(to right,#2fa878 0%,#eef0f2 50%,#8c62a8 100%)}
.parameter-center{position:absolute;left:50%;top:-3px;width:2px;height:18px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1px #d9dde1}
.parameter-marker{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#536b86;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.18);transform:translate(-50%,-50%);transition:left .4s ease}
.parameter-labels{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:#7f8b98}
.code{font-size:54px;font-weight:800;letter-spacing:.12em}.name{font-size:26px;font-weight:700;margin-top:8px}.caption{color:var(--s);margin-top:8px}
.axes{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:34px}.axis{text-align:center;padding:22px 16px;border-right:1px solid var(--line)}.axis:last-child{border:0}.al{font-size:12px;color:#9aa3ad}.ac{font-size:25px;font-weight:800;margin-top:7px}.an{font-size:13px;font-weight:700}
.sec{max-width:800px;margin:0 auto 32px}.sec h3{margin:0 0 12px;font-size:18px;padding-left:12px;border-left:4px solid #aab3bc}.sec p{margin:0;color:#647384;line-height:1.9}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.feature{background:var(--soft);border-radius:12px;padding:18px 19px}.feature h4{margin:0 0 8px;font-size:14px}.feature p{font-size:13px;line-height:1.8;color:#687687}
.recommend{background:#f0f3f5;border-radius:14px;padding:24px}.restart{text-align:center}
@media(max-width:700px){.page{padding:22px 16px 50px}h1{font-size:24px}.question{padding:30px 0}.qt{font-size:18px}.scale{grid-template-columns:68px 1fr 68px;gap:5px}.ep{font-size:12px}.choice{min-height:63px}.choice:nth-child(1) .circle,.choice:nth-child(7) .circle{width:54px;height:54px}.choice:nth-child(2) .circle,.choice:nth-child(6) .circle{width:44px;height:44px}.choice:nth-child(3) .circle,.choice:nth-child(5) .circle{width:36px;height:36px}.circle{width:29px;height:29px;border-width:2px}.labels{margin-left:73px;margin-right:73px;font-size:8px}.axes{grid-template-columns:repeat(2,1fr)}.axis:nth-child(2){border-right:0}.axis:nth-child(-n+2){border-bottom:1px solid var(--line)}.code{font-size:42px}.parameter-track{height:10px}.parameter-marker{width:18px;height:18px}.features{grid-template-columns:1fr}}

/* ===== Result theme linked to character color ===== */
#result{--theme:#536b86;--theme-soft:#f4f6f8;margin-top:30px;padding:50px 25px;border-radius:28px;background:linear-gradient(180deg,var(--theme-soft),#fff 560px);transition:background .35s ease}
#result.theme-blue{--theme:#5088c7;--theme-soft:#eaf4ff}
#result.theme-yellow{--theme:#d5a52e;--theme-soft:#fff7d8}
#result.theme-green{--theme:#55a86c;--theme-soft:#eaf8ed}
#result.theme-red{--theme:#cf6262;--theme-soft:#ffeded}
#result .hero .name{font-size:48px;font-weight:900;letter-spacing:.04em;color:var(--theme);margin:0 0 5px}
#result .hero .code{font-size:18px;font-weight:800;letter-spacing:.25em;color:#98a2ad;margin:0 0 24px}
#result .character-image{margin:0 auto 24px}
#result .sec h3{border-left-color:var(--theme)}
#result .parameter-marker{background:var(--theme)}
#result .primary{background:var(--theme)}
@media(max-width:700px){#result{padding:35px 16px}#result .hero .name{font-size:38px}#result .hero .code{font-size:15px}}

/* ===== Smartphone-first portrait layout ===== */
@media (max-width:600px){
  body{overflow-x:hidden;background:#fff}
  .page{width:100%;padding:16px 14px 34px}
  header{padding:8px 0 18px}
  .logo{font-size:10px;letter-spacing:.12em;margin-bottom:7px}
  h1{font-size:22px;line-height:1.3}
  .lead{font-size:12px;line-height:1.65;margin-top:7px}

  .start{padding:46px 4px 28px}
  .start h2{font-size:20px;line-height:1.45}
  .start p{font-size:13px;line-height:1.75;margin-bottom:24px}
  .primary,.secondary{min-height:48px;border-radius:12px;padding:12px 22px}
  .start .primary{width:100%;max-width:340px}

  .progress{padding-top:18px;position:sticky;top:0;background:rgba(255,255,255,.96);z-index:10;padding-bottom:9px}
  .pt{font-size:12px;margin-bottom:7px}
  .bar{height:4px}
  .question{padding:24px 0 18px;border-bottom:0}
  .qt{font-size:18px;line-height:1.65;margin:0 auto 28px;max-width:34em}

  /* End labels above the seven choices so the circles get the full phone width. */
  .scale{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"left right" "choices choices";gap:8px 0;width:100%}
  .ep{font-size:12px;font-weight:700;white-space:normal;line-height:1.35}
  .ep.left{grid-area:left;text-align:left}
  .ep.right{grid-area:right;text-align:right}
  .choices{grid-area:choices;width:100%;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center}
  .choice{min-width:0;min-height:52px;touch-action:manipulation}
  .choice:nth-child(1) .circle,.choice:nth-child(7) .circle{width:44px;height:44px}
  .choice:nth-child(2) .circle,.choice:nth-child(6) .circle{width:38px;height:38px}
  .choice:nth-child(3) .circle,.choice:nth-child(5) .circle{width:32px;height:32px}
  .choice:nth-child(4) .circle,.circle{width:27px;height:27px;border-width:2px}
  .choice:nth-child(-n+3) input:checked+.circle,.choice:nth-child(4) input:checked+.circle,.choice:nth-child(n+5) input:checked+.circle{box-shadow:inset 0 0 0 5px #fff}
  .labels{grid-template-columns:repeat(7,minmax(0,1fr));margin:2px 0 0;font-size:9px;width:100%}

  .nav{position:sticky;bottom:0;z-index:12;background:rgba(255,255,255,.96);padding:12px 0 max(12px,env(safe-area-inset-bottom));gap:8px;border-top:1px solid var(--line)}
  .nav .secondary{width:34%;padding-left:8px;padding-right:8px}
  .nav .primary{width:66%;padding-left:8px;padding-right:8px}

  #result{margin:0 -14px;padding:28px 14px 34px;border-radius:0;background:linear-gradient(180deg,var(--theme-soft),#fff 430px)}
  #result .hero{padding:8px 0 24px}
  #result .hero .name{font-size:34px;line-height:1.25;margin-bottom:4px}
  #result .hero .code{font-size:13px;margin-bottom:16px;letter-spacing:.22em}
  #result .character-image{width:min(250px,72vw);margin-bottom:18px;border-radius:16px}
  .parameters{margin-bottom:28px}
  .parameters-title{font-size:16px;margin-bottom:16px}
  .parameter{margin-bottom:18px}
  .parameter-head{margin-bottom:7px}
  .parameter-name{font-size:12px}.parameter-side{font-size:11px}
  .parameter-labels{font-size:9px;gap:8px}.parameter-labels span:last-child{text-align:right}
  .axes{grid-template-columns:repeat(2,1fr);margin-bottom:26px}
  .axis{padding:16px 8px}
  .axis:nth-child(2){border-right:0}.axis:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .al{font-size:10px}.ac{font-size:22px}.an{font-size:11px}
  .sec{margin-bottom:25px}
  .sec h3{font-size:16px;line-height:1.45;margin-bottom:10px}
  .sec p{font-size:13px;line-height:1.8}
  .features{grid-template-columns:1fr;gap:10px}
  .feature{padding:15px 16px}
  .feature h4{font-size:13px}.feature p{font-size:12px;line-height:1.7}
  .recommend{padding:17px 16px}
  .restart .primary{width:100%}
}
@media (max-width:360px){
  .page{padding-left:11px;padding-right:11px}
  .qt{font-size:17px}
  .choice:nth-child(1) .circle,.choice:nth-child(7) .circle{width:40px;height:40px}
  .choice:nth-child(2) .circle,.choice:nth-child(6) .circle{width:35px;height:35px}
  .choice:nth-child(3) .circle,.choice:nth-child(5) .circle{width:30px;height:30px}
  #result{margin-left:-11px;margin-right:-11px;padding-left:11px;padding-right:11px}
}
</style>

}
function calc(){
let s={B:0,C:0,A:0,O:0,L:0,N:0,D:0,E:0};
questions.forEach(q=>{let d=ans[q.id]-4;if(d>0)s[q.s]+=d;else if(d<0){let pair=q.a.split("");s[pair.find(x=>x!==q.s)]+=Math.abs(d)}});

}

const result=document.getElementById("result");
result.className="result theme-"+(themeMap[code]||"blue");
result.innerHTML='<div class="hero"><div class="name">'+names[code]+'</div><div class="code">'+code+'</div><img class="character-image" src="'+characterImages[code]+'" alt="'+code+' '+names[code]+'"><div class="caption">'+p.map(x=>info[x][1]).join(" / ")+'</div></div>'+('<div class="parameters"><h3 class="parameters-title">デザイン傾向パラメータ</h3>'+axisPairs.map(([key,left,right],idx)=>{const total=r.scores[left]+r.scores[right];const marker=total===0?50:(r.scores[right]/total)*100;return '<div class="parameter"><div class="parameter-head"><span class="parameter-name">'+info[left][0]+'</span><span class="parameter-side">'+info[p[idx]][1]+'</span></div><div class="parameter-track"><span class="parameter-center"></span><span class="parameter-marker" style="left:'+marker+'%"></span></div><div class="parameter-labels"><span>'+left+' / '+info[left][1]+'</span><span>'+right+' / '+info[right][1]+'</span></div></div>'}).join("")+'</div>')+'<div class="axes">'+dims.map(d=>'<div class="axis"><div class="al">'+d.l+'</div><div class="ac">'+d.x+'</div><div class="an">'+info[d.x][1]+'</div></div>').join("")+'</div><div class="sec"><h3>あなたのタイプ</h3><p>'+desc[code]+'</p></div><div class="sec"><h3>このタイプに合うボトルデザインの特徴</h3><div class="features">'+dims.map(d=>'<div class="feature"><h4>'+d.l+'：'+d.x+' / '+info[d.x][1]+'</h4><p>'+feature[d.x]+'</p></div>').join("")+'</div></div><div class="sec"><h3>あなたにおすすめのボトルデザイン</h3><div class="recommend"><p>'+desc[code]+' '+p.map(x=>feature[x]).join(" ")+'</p></div></div><div class="restart"><button class="primary" id="again">もう一度診断する</button></div>';
document.getElementById("quiz").classList.add("hidden");result.classList.remove("hidden");scrollTo(0,0);
document.getElementById("again").onclick=()=>{result.classList.add("hidden");document.getElementById("start").classList.remove("hidden");scrollTo(0,0)};
if(typeof window.saveDiagnosis==="function"){window.saveDiagnosis({code,...r.scores}).catch(e=>console.error("集計データ送信エラー",e));}
}

document.getElementById("startBtn").onclick=start;
document.getElementById("prev").onclick=()=>{if(i){i--;render();scrollTo(0,0)}};
document.getElementById("next").onclick=()=>{if(ans[qs[i].id]==null){alert("回答を1つ選んでください。");return}if(i<19){i++;render();scrollTo(0,0)}else showResult()};
</script>

<script>
// Google Apps Script をウェブアプリとしてデプロイした後、
// 発行された /exec で終わるURLをここに貼ってください。
const GAS_URL = "https://script.google.com/macros/s/AKfycby6rd3T-a8vbesGh4OqJ-aYlu9cVUSgs7tFdyv7xt13JaDX5Z8JtHZeksqBhHH1aYMd4g/exec";

window.saveDiagnosis = async function(data){
  if (!GAS_URL.startsWith("https://script.google.com/")) {
    console.info("Apps Script URL未設定のため、集計送信をスキップしました。");
    return;
  }

  // no-cors を使うため、送信完了レスポンスの中身はブラウザ側から読めません。
  await fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  });
};
</script>
